function startCook(id){
  var d = null;
  for (var i = 0; i < DISHES.length; i++){ if (DISHES[i].id === id) d = DISHES[i]; }
  if (!d) return;
  var topped = false, toppedMarket = false;
  Object.keys(d.needs).forEach(function(k){
    if ((state.basket[k] || 0) < d.needs[k]){
      state.basket[k] = d.needs[k] + 2;
      topped = true;
      if (MARKET_KEYS.indexOf(k) >= 0) toppedMarket = true;
    }
  });
  Object.keys(d.needs).forEach(function(k){ takeItem(k, d.needs[k]); });
  cook = { dish:id, step:1 };
  bump(); saveState();
  paint(); openSheet('cookSheet');
  Sound.page();
  if (toppedMarket) toast('이웃집에서 양념을 조금 나눠 주었어요');
  else if (topped) toast('이웃집에서 재료를 조금 나눠 주었어요');
}
function cookNext(){
  if (!cook.dish) return;
  if (cook.step === 1){
    cook.step = 2; Sound.fire(); buzz(); paint();
  } else if (cook.step === 2){
    cook.step = 3;
    state.stats.cooked++; state.today.cooked++;
    var d = currentDish();
    if (d){
      state.cookedNames.unshift(dishName(d));
      if (state.cookedNames.length > 12) state.cookedNames.length = 12;
    }
    bump(); saveState();
    Sound.done(); buzz(); paint();
  }
}

/* ═════════════════════════════════════════
   14. 이벤트
   ═════════════════════════════════════════ */
function handle(act, node){
  switch(act){
    case 'name-chip': {
      var inp = el('nameInput');
      if (inp) inp.value = node.getAttribute('data-name');
      Sound.click(); buzz();
      break;
    }
    case 'name-next': finishHello(); break;
    case 'name-skip':
      state.nickname = '';
      saveState();
      go(state.place ? 'hub' : 'town');
      Sound.name();
      break;
    case 'town-pick': pickPlace(node.getAttribute('data-town')); break;
    case 'town-next': finishPlace(); break;
    case 'open-garden': openGarden(); break;
    case 'open-stream': openStream(); break;
    case 'open-kitchen': openKitchen(); break;
    case 'open-store': openStore(); break;
    case 'map-go': mapGo(node.getAttribute('data-place')); break;
    case 'open-rice': openRice(); break;
    case 'go-garden': Sound.page(); go('garden'); break;
    case 'rice-start': riceStart(); break;
    case 'rice-plant': ricePlantTap(); break;
    case 'rice-retry': riceRetry(); break;
    case 'rice-keep': riceKeep(); break;
    case 'rice-harvest': riceHarvest(); break;
    case 'rice-again': riceStart(); break;
    case 'rice-leave': Sound.page(); go('garden'); break;
    case 'sea-start': seaStart(); break;
    case 'sea-scoop': seaScoop(); break;
    case 'sea-shore': seaShore(); break;
    case 'nb-steal': nbSteal(node.getAttribute('data-crop') || ''); break;
    case 'nb-ask': nbAsk(); break;
    case 'nb-pen': nbPickPenalty(node.getAttribute('data-pen')); break;
    case 'nb-pen-tap': nbPenTap(); break;
    case 'nb-back': nbBack(); break;
    case 'nb-switch': nbSwitch(); break;
    case 'sell-item': sellItem(node.getAttribute('data-item')); break;
    case 'buy-good': buyGood(node.getAttribute('data-item')); break;
    case 'gt-sea': groupTestSea(); break;
    case 'gt-neighbor': groupTestNeighbor(); break;
    case 'gt-switch': groupTestSwitch(); break;
    case 'gt-caught': groupTestCaught(); break;
    case 'gt-penalty': groupTestPenalty(); break;
    case 'gt-market': groupTestMarket(); break;
    case 'go-hub': Sound.page(); go('hub'); break;
    case 'garden-till':
      state.garden.tilled = true;
      state.garden.seed = null;
      state.garden.water = 0;
      state.garden.cells = [false,false,false];
      bump(); saveState();
      Sound.till(); buzz(); paint();
      break;
    case 'garden-seed':
      state.garden.seed = node.getAttribute('data-seed');
      state.garden.water = 0;
      state.garden.cells = [false,false,false];
      bump(); saveState();
      Sound.seed(); buzz(); paint();
      break;
    case 'garden-water': gardenWater(); break;
    case 'garden-plot': gardenPlot(parseInt(node.getAttribute('data-cell'), 10) || 0); break;
    case 'garden-all': gardenAll(); break;
    case 'garden-again': gardenAgain(); break;
    case 'garden-snail': gardenSnail(); break;
    case 'paddy-look': paddyLook(); break;
    case 'stream-catch': catchCritter(parseInt(node.getAttribute('data-idx'), 10)); break;
    case 'stream-respawn': respawnStream(); break;
    case 'dish-pick': startCook(node.getAttribute('data-dish')); break;
    case 'cook-next': cookNext(); break;
    case 'cook-again': cookAgain(); break;
    case 'cook-close': cookClose(); break;
    case 'store-pick': pickStoreItem(node.getAttribute('data-item')); break;
    case 'radio-play': playRadio(); break;
    case 'end-day': endDay(); break;
    case 'day-next': dayNext(); break;
    case 'day-stay': closeSheet('daySheet'); Sound.click(); break;
    case 'season-close': seasonClose(); break;
    case 'records-open': openRecords(); break;
    case 'records-close': recordsClose(); break;
    case 'records-reset': recordsReset(); break;
    case 'sound-toggle': toggleSound(); break;
    case 'sky-preview': skyPreview(node.getAttribute('data-sky')); break;
    case 'sky-hour-test': skyHourTest(); break;
    case 'sky-play-reset': playReset(); break;
    case 'dusk-home': duskHome(); break;
    case 'dusk-stay': duskStay(); break;
    default: break;
  }
}

function onClick(e){
  var node = e.target;
  while (node && node !== document && !(node.getAttribute && node.getAttribute('data-act'))){
    node = node.parentNode;
  }
  if (!node || !node.getAttribute || !node.getAttribute('data-act')) return;
  handle(node.getAttribute('data-act'), node);
}

function init(){
  var app = el('app');
  if (!app) return;
  app.addEventListener('click', onClick);
  Sound.setOn(state.sound !== false);
  var stale = !state.playStartMs || state.playStartDay !== todayLabel() ||
              (Date.now() - state.playStartMs > 6 * 60 * 60 * 1000);
  if (stale){ state.playStartMs = 0; state.playStartDay = todayLabel(); saveState(); }
  skyApply();
  if (typeof setInterval === 'function') setInterval(tickSky, 20000);
  if (state.place){
    streamObjects = null;
    go('hub');
  } else if (state.nickname){
    go('town');
  } else {
    go('hello');
  }
}

/* 디버그 · 자동 점검용 (화면에는 영향 없음) */
try{
  if (typeof window !== 'undefined'){
    window.__garden = {
      get state(){ return state; },
      handle: handle, paint: paint, go: go,
      seasonIndexOf: seasonIndexOf, gardenStage: gardenStage,
      itemName: itemName, canCook: canCook, calledName: calledName,
      hubHTML: hubHTML, gardenHTML: gardenHTML, streamHTML: streamHTML,
      kitchenHTML: kitchenHTML, storeHTML: storeHTML, recordHTML: recordHTML,
      cookHTML: cookHTML, dayHTML: dayHTML, seasonHTML: seasonHTML,
      startCook: startCook, cookNext: cookNext, catchCritter: catchCritter,
      buildStream: buildStream, gardenWater: gardenWater, gardenAll: gardenAll,
      dayNext: dayNext, toggleSound: toggleSound, recordsReset: recordsReset,
      setCook: function(id, step){ cook = { dish:id, step:step }; },
      /* 마을 지도 */
      mapPos: function(){ return mapPos; },
      walkState: function(){ return walk; },
      mapGo: mapGo, mapWalk: mapWalk, mapHTML: mapHTML, mapNodeHTML: mapNodeHTML,
      mapKidPoint: mapKidPoint, mapWalkPath: mapWalkPath, mapSyncFromState: mapSyncFromState,
      polyAt: polyAt, polyLen: polyLen, MAP_SPOTS: MAP_SPOTS, MAP_ROADS: MAP_ROADS, MAP_HOME: MAP_HOME,
      /* 벼 모내기 */
      riceGame: function(){ return riceGame; },
      riceHTML: riceHTML, riceStart: riceStart, ricePlantTap: ricePlantTap,
      riceRetry: riceRetry, riceKeep: riceKeep, riceHarvest: riceHarvest,
      riceYield: riceYield, riceAccuracy: riceAccuracy, openRice: openRice, riceFallStart: riceFallStart,
      setRiceY: function(y){ riceGame.y = y; },
      /* 시간대별 하늘 · 해와 달 */
      skyInfo: skyInfo, skyApply: skyApply, skyHeadHTML: skyHeadHTML, skyOrbStyle: skyOrbStyle,
      overHour: overHour, playMinutes: playMinutes, clockHours: clockHours,
      skyPreview: skyPreview, skyHourTest: skyHourTest, playReset: playReset,
      openDusk: openDusk, duskStay: duskStay, duskHome: duskHome,
      /* 바다 · 포구 */
      seaHTML: seaHTML, seaStart: seaStart, seaScoop: seaScoop, seaShore: seaShore,
      seaGame: function(){ return seaGame; }, openSea: openSea,
      SEA_SPOTS: SEA_SPOTS, SEA_KINDS: SEA_KINDS, SEA_LIMIT: SEA_LIMIT,
      /* 이웃집 서리 · 옛날 벌칙 */
      neighborHTML: neighborHTML, openNeighbor: openNeighbor, nbSteal: nbSteal, nbAsk: nbAsk,
      nbPickPenalty: nbPickPenalty, nbPenTap: nbPenTap, nbPenaltyDone: nbPenaltyDone,
      nbBack: nbBack, nbSwitch: nbSwitch, nbForceCaught: nbForceCaught,
      nbGame: function(){ return nbGame; }, NEIGHBORS: NEIGHBORS, PENALTIES: PENALTIES,
      nbWatchPaint: nbWatchPaint,
      /* 장터 · 엽전 */
      sellItem: sellItem, buyGood: buyGood, SELL_PRICE: SELL_PRICE, MARKET_GOODS: MARKET_GOODS,
      placeGo: placeGo, openStore: openStore,
      nowMs: nowMs
    };
  }
}catch(e){}

if (typeof document !== 'undefined' && document.getElementById && document.addEventListener){
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}
})();
</script>
