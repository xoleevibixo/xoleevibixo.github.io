<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>기억의 텃밭 · 강화도 우리 집 (시니어 프로토타입)</title>
<style>
:root{
  --cream:#FCF8EE;
  --paper:#F6EEDC;
  --ink:#33302A;
  --ink-soft:#5C5348;
  --soil:#8B6A43;
  --soil-deep:#6E5233;
  --leaf:#6E8E4E;
  --leaf-deep:#4F6B37;
  --sun:#E0A24C;
  --line:#E4D8BE;
  --white:#FFFDF7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Apple SD Gothic Neo","AppleGothic","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  background:#E7DDC9;
  color:var(--ink);
  font-size:21px;
  line-height:1.5;
  display:flex;
  justify-content:center;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}

/* ───────── 앱 프레임 ───────── */
.app{
  position:relative;
  width:100%;
  max-width:430px;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.75), rgba(255,255,255,0) 62%),
    repeating-linear-gradient(90deg, rgba(139,106,67,.05) 0 1px, rgba(139,106,67,0) 1px 7px),
    linear-gradient(#FCF8EE,#F7EFDD);
  box-shadow:0 0 44px rgba(90,70,40,.18);
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;
  background:linear-gradient(#FCF8EE,rgba(252,248,238,.88));
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(139,106,67,.14);
}
.brand{font-size:19px;letter-spacing:.1em;color:var(--soil);font-weight:700}
.icon-btn{
  width:52px;height:52px;border-radius:16px;border:1px solid var(--line);
  background:var(--white);font-size:23px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 0 rgba(139,106,67,.12);
  transition:transform .12s ease;
}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn[aria-pressed="false"]{opacity:.62}
#screens{flex:1;display:flex;flex-direction:column;min-width:0}

/* ───────── 화면 ───────── */
.screen{display:none;flex:1;flex-direction:column;padding:16px 18px 10px;min-width:0}
.screen.is-active{display:flex;animation:fadeUp .38s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ───────── 공통 요소 ───────── */
.q{margin:0 0 6px;font-size:29px;line-height:1.38;font-weight:800;letter-spacing:-.02em;color:#2C2822}
.sub{margin:0 0 16px;font-size:21px;color:var(--ink-soft)}
.screen-title{margin:2px 0 10px;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:-.02em}
.hint{margin:0 0 12px;font-size:21px;line-height:1.5;color:var(--ink-soft);word-break:keep-all;overflow-wrap:anywhere}
.sub{margin:0 0 16px;font-size:21px;color:var(--ink-soft);word-break:keep-all}
.back{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  min-height:54px;padding:0 16px;border-radius:18px;border:1px solid var(--line);
  background:var(--white);font-size:20px;color:var(--soil-deep);
  cursor:pointer;margin-bottom:12px;box-shadow:0 2px 0 rgba(139,106,67,.1);
}
.back:active{transform:translateY(2px);box-shadow:none}

.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:70px;padding:10px 16px;border:none;border-radius:22px;
  font-size:24px;font-weight:700;letter-spacing:-.01em;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn--primary{background:linear-gradient(#7C9A5A,#62813F);color:#fff;box-shadow:0 4px 0 #4A6530}
.btn--night{background:linear-gradient(#5E6B8A,#465170);color:#fff;box-shadow:0 4px 0 #333C55;min-height:74px;font-size:22px;margin:16px 0 20px;line-height:1.3}
.btn--ghost{background:var(--white);color:var(--soil-deep);border:2px solid var(--line);box-shadow:none;min-height:62px;font-size:21px}
.btn--xl{min-height:78px;font-size:25px}
.btn:disabled{opacity:.5;box-shadow:none}
.btn-link{
  width:100%;min-height:50px;border:none;background:none;cursor:pointer;
  font-size:20px;color:#8A7F68;text-decoration:underline;text-underline-offset:4px;
}

.card-talk{
  margin-top:14px;padding:14px 16px;border-radius:18px;background:#FFFDF7;
  border:1px dashed rgba(139,106,67,.45);font-size:20px;line-height:1.5;color:var(--ink-soft);
  word-break:keep-all;overflow-wrap:anywhere;
}
.card-talk b{color:var(--soil-deep);display:block;font-size:19px;letter-spacing:.02em;margin-bottom:2px}

/* ═════════ 마을 풍경(초가집 · 논 · 냇가) ═════════ */
.village{
  position:relative;height:214px;overflow:hidden;
  border-radius:0 0 30px 30px;margin:-16px -18px 12px;
  background:linear-gradient(#FBEFD3,#F8DFBB 62%,#F3D2AC);
}
.v-sky{position:absolute;inset:0}
.v-sun{
  position:absolute;right:34px;top:22px;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFEDB8,#EDAE5C);
  box-shadow:0 0 34px rgba(237,174,92,.55);
}
.v-mtn{
  position:absolute;left:-24%;bottom:92px;width:96%;height:74px;
  border-radius:52% 58% 0 0/100% 100% 0 0;background:#9FB08A;opacity:.85;
}
.v-mtn.b{left:36%;width:88%;height:62px;background:#AEBE97;opacity:.75}
.v-paddy{
  position:absolute;left:-6%;right:-6%;bottom:44px;height:54px;
  background:repeating-linear-gradient(90deg,#CBD98E 0 13px,#B9C97C 13px 17px,#DCE7A9 17px 29px);
  border-top:2px solid #8FA768;
}
.v-paddy .v-rice{position:absolute;left:0;right:0;top:-13px;font-size:15px;letter-spacing:3px;opacity:.85;white-space:nowrap;overflow:hidden}
.v-house{position:absolute;left:20px;bottom:64px;width:104px;height:54px}
.v-roof{
  position:absolute;left:-18px;top:-30px;width:0;height:0;
  border-left:70px solid transparent;border-right:70px solid transparent;
  border-bottom:34px solid #C9A667;
}
.v-ridge{position:absolute;left:-8px;top:-34px;width:120px;height:8px;border-radius:6px;background:#B8944F}
.v-wall{position:absolute;inset:0;background:#F2E6CC;border-radius:3px;border-bottom:3px solid #D8C7A6}
.v-door{position:absolute;left:16px;bottom:0;width:26px;height:34px;background:#8B6A43;border-radius:4px 4px 0 0}
.v-window{position:absolute;right:14px;bottom:16px;width:24px;height:20px;background:#A9C4C9;border:2px solid #8B6A43;border-radius:2px}
.v-yard{position:absolute;left:8px;bottom:48px;font-size:19px;letter-spacing:1px}
.v-tree{position:absolute;right:-2px;bottom:44px;font-size:32px}
.v-smoke{position:absolute;left:78px;bottom:118px;width:0;height:0}
.v-smoke i{
  position:absolute;display:block;width:11px;height:11px;border-radius:50%;
  background:rgba(255,255,255,.82);animation:smoke 4.6s ease-in-out infinite;
}
.v-smoke i:nth-child(2){animation-delay:1.5s}
.v-smoke i:nth-child(3){animation-delay:3s}
@keyframes smoke{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  25%{opacity:.85}
  100%{opacity:0;transform:translate(-18px,-56px) scale(1.9)}
}
.v-creek{
  position:absolute;left:-6%;right:-6%;bottom:0;height:48px;
  background:linear-gradient(#B7E0E6,#87C2CE 55%,#6FB0BE);
  border-top:3px solid #8FB788;
}
.v-creek::after{
  content:"";position:absolute;left:12%;top:10px;width:40%;height:4px;border-radius:4px;
  background:rgba(255,255,255,.55);box-shadow:60px 14px 0 rgba(255,255,255,.4),140px 2px 0 rgba(255,255,255,.45);
}
.v-place{position:absolute;right:14px;bottom:54px;font-size:19px;color:#5B6B45;opacity:.9}

.call-line{margin:0 0 2px;font-size:24px;color:#7C4B2A;font-weight:800;letter-spacing:-.01em}
.hello-place{margin:0 0 18px;font-size:19px;color:#8A7F68}
.field-label{display:block;margin:16px 0 8px;font-size:20px;color:var(--ink-soft)}
.name-input{
  width:100%;min-width:0;min-height:74px;padding:12px 18px;border-radius:20px;
  border:2px solid var(--line);background:var(--white);
  font-family:inherit;font-size:28px;font-weight:700;color:var(--ink);
  text-align:center;letter-spacing:.02em;
}
.name-input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(110,142,78,.18)}
.name-input::placeholder{color:#C3B69C;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.chip{
  min-height:62px;border-radius:18px;border:2px solid var(--line);
  background:var(--white);font-size:22px;font-weight:700;color:var(--soil-deep);
  cursor:pointer;box-shadow:0 3px 0 rgba(139,106,67,.1);
}
.chip:active{transform:translateY(2px);box-shadow:none}

/* ───────── 놀이터 선택 ───────── */
.town-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.town-card{
  position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:158px;padding:14px 10px;border-radius:22px;
  border:3px solid var(--line);background:linear-gradient(#FFFDF7,#F9F0DC);
  cursor:pointer;box-shadow:0 4px 0 rgba(139,106,67,.12);transition:transform .12s ease;
}
.town-card:active{transform:translateY(2px);box-shadow:none}
.town-card.is-selected{border-color:var(--leaf);background:linear-gradient(#F4F8EA,#EAF1DA)}
.town-card.is-selected::after{
  content:"✓";position:absolute;top:8px;right:10px;
  width:30px;height:30px;border-radius:50%;background:var(--leaf);color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.tw-emoji{font-size:44px;line-height:1}
.tw-name{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tw-sub{font-size:18px;color:#8A7F68}
#btnTownNext{margin-top:18px}

/* ───────── 허브 ───────── */
.greet{margin:0 0 3px;font-size:26px;line-height:1.35;font-weight:800;letter-spacing:-.02em}
.hub-meta{margin:0 0 3px;font-size:19px;color:var(--soil);font-weight:700}
.hub-line{margin:0 0 10px;font-size:19px;color:var(--ink-soft);line-height:1.45}

.radio{
  display:flex;align-items:center;gap:14px;width:100%;min-height:88px;text-align:left;
  padding:12px 16px;border-radius:20px;cursor:pointer;
  border:2px solid #C9A97A;background:linear-gradient(#F3E3C6,#E7D0A8);
  box-shadow:0 4px 0 rgba(139,106,67,.22);margin-bottom:14px;
}
.radio:active{transform:translateY(2px);box-shadow:none}
.radio-face{font-size:34px;line-height:1}
.radio-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.radio-text b{font-size:21px;color:#5A4022}
.radio-text span{font-size:19px;color:#7A6142;line-height:1.35}

.basket{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:12px}
.basket-head{font-size:19px;color:var(--soil);font-weight:700;letter-spacing:.03em;margin-bottom:8px}
.basket-items{display:flex;flex-wrap:wrap;gap:6px}
.basket-item{
  display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:6px;
  padding:4px 9px;border-radius:999px;background:#F6EEDC;
  border:1px solid rgba(139,106,67,.18);font-size:18px;color:#4A4336;
}
.basket-item b{font-size:18px;color:var(--soil-deep)}
.basket-item.is-empty{opacity:.4}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;
  min-height:150px;padding:16px 14px;border-radius:22px;text-align:left;
  border:1px solid rgba(139,106,67,.2);
  background:linear-gradient(#FFFDF7,#FBF2E0);
  box-shadow:0 4px 0 rgba(139,106,67,.13);cursor:pointer;
  transition:transform .12s ease;
}
.act:active{transform:translateY(2px);box-shadow:none}
.act-emoji{font-size:36px;line-height:1.1}
.act-name{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.act-sub{font-size:19px;color:#7A6E58;line-height:1.35}
.badge-zero{
  margin:14px 0 0;text-align:center;font-size:19px;color:#8A7F68;letter-spacing:.02em;
}

/* ───────── 마을 지도(허브) ───────── */
.map-wrap{margin:0 0 12px}
.map-scene{
  position:relative;height:392px;border-radius:26px;overflow:hidden;
  border:1px solid rgba(139,106,67,.25);
  background:linear-gradient(#E9F4FA 0%,#E7F1DA 40%,#DDEBC6 70%,#CFE0AE 100%);
  background-size:cover;background-position:center;
  -webkit-user-select:none;user-select:none;
}
.map-roads{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.map-node{
  position:absolute;transform:translate(-50%,-50%);z-index:5;
  display:flex;flex-direction:column-reverse;align-items:center;gap:5px;
  width:118px;padding:0;border:0;background:none;cursor:pointer;
  font-family:inherit;color:inherit;
}
.mn-bubble{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:50%;font-size:32px;line-height:1;
  background:radial-gradient(circle at 40% 30%,#FFFDF7,#FFF4DD);
  border:2px solid rgba(139,106,67,.3);
  box-shadow:0 5px 12px rgba(90,70,40,.2),0 0 0 5px rgba(255,255,255,.5);
  transition:transform .14s ease,box-shadow .2s ease;
}
.map-node:active .mn-bubble{transform:scale(.94)}
.map-node.is-here .mn-bubble{
  border-color:var(--leaf);
  box-shadow:0 5px 12px rgba(90,70,40,.2),0 0 0 5px rgba(255,255,255,.5),0 0 0 9px rgba(110,142,78,.32);
}
.mn-name{
  font-size:19px;font-weight:800;letter-spacing:-.02em;color:#3B4A32;line-height:1.15;
  padding:2px 9px;border-radius:999px;background:rgba(255,253,247,.9);
  border:1px solid rgba(139,106,67,.2);white-space:nowrap;
}
.map-kid{
  position:absolute;z-index:7;height:68px;
  transform:translate(-50%,-100%);pointer-events:none;
}
.map-kid.is-left{transform:translate(-50%,-100%) scaleX(-1)}
.kid-img{height:100%;width:auto;display:block;filter:drop-shadow(0 3px 4px rgba(60,50,30,.28))}
.map-dog{
  position:absolute;z-index:6;height:36px;
  transform:translate(-50%,-100%);pointer-events:none;
}
.map-dog.is-left{transform:translate(-50%,-100%) scaleX(-1)}
.dog-img{height:100%;width:auto;display:block;filter:drop-shadow(0 2px 3px rgba(60,50,30,.25))}
.map-dots{position:absolute;inset:0;z-index:5;pointer-events:none}
.map-step{
  position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;
  background:rgba(255,255,255,.95);box-shadow:0 0 8px rgba(255,236,170,.95);
  animation:stepFade .95s ease-out forwards;
}
@keyframes stepFade{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
.map-kid.is-walking .kid-img{animation:kidBob .36s ease-in-out infinite}
.map-dog.is-walking .dog-img{animation:kidBob .32s ease-in-out infinite}
@keyframes kidBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.6px) rotate(-1.6deg)}}
.map-note{margin:8px 0 0;text-align:center;font-size:18px;color:#8A7F68;line-height:1.4}
.hub-place{color:var(--soil);font-weight:700}

/* ───────── 텃밭 ───────── */
.garden-scene{
  position:relative;border-radius:26px;overflow:hidden;
  background:linear-gradient(#F0F5E0,#E2EDCB 34%,#CBD6A0 34%,#C7D3A2);
  padding:12px 12px 16px;border:1px solid rgba(139,106,67,.2);
}
.g-paddy{
  position:relative;height:52px;margin:-12px -12px 12px;cursor:pointer;width:calc(100% + 24px);
  background:repeating-linear-gradient(90deg,#CBD98E 0 12px,#B7C87A 12px 16px,#DCE7A9 16px 28px);
  border:none;border-bottom:3px solid #9CB073;
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 10px 0 0;font-family:inherit;font-size:19px;color:#586B3C;gap:8px;
}
.g-paddy .g-rice{font-size:20px;letter-spacing:2px}
.g-paddy .g-paddy-label{font-weight:700;opacity:.85}
.g-sun-row{display:flex;justify-content:space-between;font-size:20px;color:#6B7B52;margin-bottom:8px;padding:0 4px}
.soil{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  padding:12px;border-radius:20px;
  background:repeating-linear-gradient(0deg,#B08A5F 0 10px,#A67F55 10px 12px);
  border:4px solid #98724A;position:relative;
}
.plot{
  position:relative;min-height:106px;border-radius:16px;border:2px dashed rgba(255,255,255,.28);
  background:radial-gradient(circle at 50% 62%,#C39B70,#AC8155);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;line-height:1;cursor:pointer;padding:0;
  transition:transform .12s ease,background .3s;
}
.plot:active{transform:scale(.97)}
.plot.is-tilled{background:radial-gradient(circle at 50% 62%,#B98F63,#9E7348);border-style:solid;border-color:rgba(255,255,255,.18)}
.plot.is-ready{box-shadow:0 0 0 3px rgba(255,232,160,.85),0 0 22px rgba(255,214,120,.7)}
.plot .plant{display:inline-block;animation:growPop .45s ease both}
@keyframes growPop{from{transform:scale(.4) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.plot .plant.ripe{animation:ripeGlow 2.2s ease-in-out infinite}
@keyframes ripeGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.seed-dot{
  display:block;width:16px;height:16px;border-radius:50%;
  background:#6B4E32;box-shadow:inset 0 -2px 2px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.18);
}
.snail-row{
  display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;
  min-height:64px;padding:10px 16px;border-radius:18px;text-align:left;
  border:2px dashed rgba(139,106,67,.45);background:#FFFDF7;
  font-size:20px;color:var(--soil-deep);cursor:pointer;
}
.drops{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px}
.drops .drop{
  position:absolute;top:-16px;width:10px;height:16px;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:linear-gradient(#CFEFFA,#6FBBD6);opacity:0;
}
.garden-scene.is-watering .drop{animation:fall .8s ease-in forwards}
.garden-scene.is-watering .drop:nth-child(1){left:12%;animation-delay:.02s}
.garden-scene.is-watering .drop:nth-child(2){left:28%;animation-delay:.1s}
.garden-scene.is-watering .drop:nth-child(3){left:44%;animation-delay:.05s}
.garden-scene.is-watering .drop:nth-child(4){left:60%;animation-delay:.14s}
.garden-scene.is-watering .drop:nth-child(5){left:76%;animation-delay:.08s}
.garden-scene.is-watering .drop:nth-child(6){left:90%;animation-delay:.18s}
@keyframes fall{
  0%{opacity:0;transform:translateY(0) scaleY(.8)}
  15%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(240px) scaleY(1.5)}
}
.seed-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.seed-card{
  display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 16px;
  border-radius:20px;border:2px solid var(--line);background:var(--white);
  cursor:pointer;box-shadow:0 3px 0 rgba(139,106,67,.1);text-align:left;
}
.seed-card:active{transform:translateY(2px);box-shadow:none}
.seed-card .s-emoji{font-size:32px}
.seed-card .s-name{font-size:23px;font-weight:800}
.seed-card .s-sub{font-size:18px;color:#8A7F68;margin-left:auto;text-align:right}
.reward{
  margin-top:14px;padding:18px;border-radius:22px;text-align:center;
  background:linear-gradient(#FFF9E8,#FBEECB);border:2px solid #EBD9A8;
}
.reward .r-big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.reward .r-sub{font-size:20px;color:var(--ink-soft);margin-top:4px}
.pick-line{margin:16px 0 0;font-size:21px;font-weight:700;color:var(--soil-deep)}

/* ───────── 냇가 ───────── */
.stream-scene{
  position:relative;border-radius:26px;overflow:hidden;min-height:360px;
  border:4px solid #C6B293;
  background:
    radial-gradient(ellipse at 22% 18%, rgba(255,255,255,.42), rgba(255,255,255,0) 42%),
    radial-gradient(ellipse at 74% 62%, rgba(255,255,255,.3), rgba(255,255,255,0) 40%),
    linear-gradient(#CFEAF0 0%,#9FD3DE 34%,#6FB4C6 68%,#4C97AF 100%);
}
.stream-scene::before{
  content:"";position:absolute;left:0;right:0;top:0;height:26px;pointer-events:none;
  background:linear-gradient(#8FB788,#A8C79C);opacity:.9;
}
.stream-scene::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:40px;pointer-events:none;
  background:linear-gradient(rgba(126,166,99,0),#7FA663 70%);
}
.stone-row{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:22px;letter-spacing:14px;opacity:.95}
.critter{
  position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:none;font-size:46px;cursor:pointer;padding:0;
  filter:drop-shadow(0 4px 4px rgba(20,70,90,.25));
  animation:bob 3.4s ease-in-out infinite;
  transition:transform .3s ease,opacity .3s ease;
}
.critter:nth-child(3n){animation-duration:4.1s}
.critter:nth-child(3n+1){animation-delay:.6s}
.critter:nth-child(4n){animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.critter.is-caught{transform:translateY(-52px) scale(.5);opacity:0;animation:none}
.stream-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.stream-count{font-size:20px;font-weight:700;color:var(--soil-deep)}
.stream-foot .btn{width:auto;min-width:146px;padding:0 16px;flex:0 0 auto}

/* ───────── 부엌 ───────── */
.kitchen-scene{
  position:relative;border-radius:26px;overflow:hidden;height:224px;
  background:linear-gradient(#F3E7CE,#E7D4B2 62%,#D9C29B);
  border:1px solid rgba(139,106,67,.22);
}
.hearth{position:absolute;inset:0}
.boo{
  position:absolute;left:0;right:0;bottom:0;height:58px;
  background:repeating-linear-gradient(90deg,#B08A5F 0 26px,#A67F55 26px 30px);
  border-top:4px solid #98724A;
}
.boo::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.18)}
.fire-mouth{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  width:96px;height:42px;border-radius:46px 46px 6px 6px;
  background:radial-gradient(ellipse at 50% 80%,#FFC366,#E0712E 52%,#7A3A15);
  box-shadow:0 0 26px rgba(240,140,60,.65);
  animation:ember 2.8s ease-in-out infinite;
}
@keyframes ember{0%,100%{box-shadow:0 0 18px rgba(240,140,60,.5)}50%{box-shadow:0 0 34px rgba(255,170,80,.85)}}
.cauldron{
  position:absolute;left:50%;bottom:62px;transform:translateX(-50%);
  width:164px;height:86px;
  background:radial-gradient(circle at 38% 26%,#5E5E5E,#2B2B2B 78%);
  border-radius:12px 12px 80px 80px/12px 12px 66px 66px;
  box-shadow:inset 0 -12px 22px rgba(0,0,0,.55),0 8px 16px rgba(90,70,40,.25);
}
.cauldron::before{
  content:"";position:absolute;left:-12px;right:-12px;top:-10px;height:22px;border-radius:50%;
  background:linear-gradient(#8A8A8A,#4A4A4A);border:2px solid #3A3A3A;
}
.cauldron::after{
  content:"";position:absolute;left:-42px;top:26px;width:34px;height:12px;border-radius:8px;
  background:#3A3A3A;box-shadow:190px 0 0 #3A3A3A;
}
.steam{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:64px;height:56px}
.steam i{
  position:absolute;bottom:0;left:50%;width:12px;height:12px;border-radius:50%;
  background:rgba(255,255,255,.85);animation:steamUp 3.8s ease-in-out infinite;
}
.steam i:nth-child(2){left:20%;animation-delay:1.3s}
.steam i:nth-child(3){left:74%;animation-delay:2.6s}
@keyframes steamUp{
  0%{opacity:0;transform:translateY(0) scale(.7)}
  30%{opacity:.9}
  100%{opacity:0;transform:translateY(-60px) scale(2)}
}
.kitchen-note{
  position:absolute;left:14px;top:12px;padding:6px 12px;border-radius:999px;
  background:rgba(255,253,247,.9);border:1px solid rgba(139,106,67,.25);
  font-size:18px;color:var(--soil-deep);font-weight:700;
}
.dish-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.dish{
  display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:90px;min-width:0;
  border-radius:22px;border:2px solid var(--line);background:var(--white);
  cursor:pointer;box-shadow:0 4px 0 rgba(139,106,67,.12);text-align:left;
}
.dish:active{transform:translateY(2px);box-shadow:none}
.dish-emoji{font-size:34px;line-height:1}
.dish-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dish-info b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.dish-need{font-size:18px;color:#8A7F68;line-height:1.35;word-break:keep-all}
.dish-go{
  font-size:18px;font-weight:700;color:#fff;background:var(--leaf);
  padding:8px 13px;border-radius:999px;white-space:nowrap;
}

/* ───────── 구멍가게 ───────── */
.store-scene{
  position:relative;border-radius:26px;padding:54px 14px 16px;
  background:linear-gradient(#F0DFC0,#E3CCA4);
  border:1px solid rgba(139,106,67,.25);
  box-shadow:inset 0 -10px 20px rgba(139,106,67,.14);
}
.store-sign{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  padding:6px 20px;border-radius:8px;background:#6E5233;color:#F7E9C9;
  font-size:20px;letter-spacing:.3em;font-weight:700;
  box-shadow:0 3px 0 rgba(0,0,0,.18);
}
.jar-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.jar{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  border:none;background:none;cursor:pointer;padding:0;
}
.jar-glass{
  position:relative;width:82px;height:96px;border-radius:16px 16px 20px 20px;
  background:linear-gradient(155deg,rgba(255,255,255,.86),rgba(206,232,238,.6));
  border:3px solid rgba(255,255,255,.9);
  box-shadow:inset 0 -10px 16px rgba(120,160,170,.25),0 5px 0 rgba(139,106,67,.18);
  display:flex;align-items:center;justify-content:center;font-size:36px;
  transition:transform .12s ease;
}
.jar:active .jar-glass{transform:scale(.94)}
.jar-lid{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:58px;height:12px;border-radius:6px;background:#B5764C;
}
.jar-name{font-size:19px;font-weight:700;color:var(--soil-deep)}
.store-line{
  margin:14px 0 0;padding:14px 16px;border-radius:18px;background:#FFFDF7;
  border:1px dashed rgba(139,106,67,.4);font-size:20px;line-height:1.5;color:var(--ink-soft);
  min-height:76px;word-break:keep-all;
}

/* ───────── 벼 모내기(논) ───────── */
.rice-hud{
  display:flex;justify-content:space-between;gap:8px;align-items:center;
  margin:0 0 8px;padding:0 4px;font-size:20px;font-weight:700;color:#3E5B4A;
}
.rice-scene{
  position:relative;height:344px;border-radius:26px;overflow:hidden;
  border:4px solid #C6B293;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.45), rgba(255,255,255,0) 44%),
    linear-gradient(#CFEAF0 0%,#9FD3DE 28%,#6FB4C6 64%,#4C97AF 100%);
  background-size:cover;background-position:center;
  box-shadow:inset 0 0 44px rgba(52,74,46,.22);
  -webkit-user-select:none;user-select:none;
}
.rice-scene.is-tappable{cursor:pointer}
.rice-band{
  position:absolute;left:0;right:0;z-index:2;
  background:linear-gradient(rgba(126,186,88,.55),rgba(255,203,92,.6));
  border-top:4px solid #FFFFFF;border-bottom:4px solid #FFFFFF;
  box-shadow:0 0 0 3px rgba(46,74,38,.32),inset 0 0 22px rgba(255,255,255,.42);
  transition:background .22s ease,box-shadow .22s ease;
}
.rice-band.is-hot{
  background:linear-gradient(rgba(168,222,110,.78),rgba(255,216,120,.85));
  box-shadow:0 0 0 3px rgba(46,74,38,.28),0 0 34px rgba(255,236,150,1);
}
.rice-guide{position:absolute;left:0;right:0;z-index:2;border-top:3px dashed rgba(255,255,255,.85);opacity:.9}
.rice-drop{
  position:absolute;transform:translate(-50%,-50%);z-index:4;font-size:56px;line-height:1;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 5px 6px rgba(20,60,70,.45));
}
.rice-drop::after{
  content:"";position:absolute;left:-34px;right:-34px;top:-34px;bottom:-34px;
  border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 68%);
}
.rice-mound{
  position:absolute;transform:translate(-50%,-50%);z-index:3;font-size:38px;line-height:1;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 4px 5px rgba(20,60,70,.4));
  animation:growPop .45s ease both;
}
.rice-mound.is-crooked{transform:translate(-50%,-50%) rotate(-20deg)}
.rice-ghost{
  position:absolute;transform:translate(-50%,-50%);z-index:3;font-size:30px;opacity:.5;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.9));
}
.rice-tip{
  margin:12px 0 4px;padding:14px 16px;border-radius:18px;background:#FFF6E0;
  border:2px solid #EEDCB2;font-size:20px;line-height:1.5;color:#5A4A30;
}
.rice-msg{
  margin:12px 0 4px;padding:16px;border-radius:20px;background:#FFF6E0;
  border:2px solid #EEDCB2;font-size:21px;line-height:1.55;color:#5A4A30;text-align:center;
}
.rice-msg b{display:block;font-size:23px;color:#7C4B2A;margin-bottom:4px;letter-spacing:-.01em}
.rice-note{margin:10px 0 4px;text-align:center;font-size:20px;color:#8A7F68}
.btn--plant{
  margin-top:12px;min-height:88px;font-size:26px;border-radius:26px;
  background:linear-gradient(#E8B75C,#D29A3C);color:#4A3208;
  box-shadow:0 5px 0 #B27F2A;
}
.btn--plant.is-hot{animation:plantHot .95s ease-in-out infinite}
@keyframes plantHot{
  0%,100%{box-shadow:0 5px 0 #B27F2A}
  50%{box-shadow:0 5px 0 #B27F2A,0 0 26px rgba(255,214,120,.95);transform:scale(1.02)}
}
.rice-entry{
  display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;
  min-height:78px;padding:12px 16px;border-radius:20px;text-align:left;
  border:2px solid #D8C48E;background:linear-gradient(#FFF9E6,#FBEDC4);
  box-shadow:0 3px 0 rgba(139,106,67,.14);cursor:pointer;font-family:inherit;color:inherit;
}
.rice-entry:active{transform:translateY(2px);box-shadow:none}
.rice-entry .re-emoji{font-size:32px;line-height:1}
.rice-entry .re-text{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px}
.rice-entry b{font-size:22px;color:#5A4022}
.rice-entry .re-sub{font-size:18px;color:#8A7F68;line-height:1.3}
.rice-entry .re-go{
  font-size:18px;font-weight:700;color:#fff;background:var(--leaf);
  padding:8px 13px;border-radius:999px;white-space:nowrap;
}

/* ───────── 시트 ───────── */
.sheet{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:flex-end;justify-content:center;
  background:rgba(51,48,42,.44);
}
.sheet.is-open{display:flex;animation:fadeIn .24s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-card{
  width:100%;max-width:430px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(#FCF8EE,#F6EEDC);
  border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  animation:slideUp .3s ease both;
}
@keyframes slideUp{from{transform:translateY(24px)}to{transform:none}}
.sheet-title{margin:0 0 12px;font-size:25px;font-weight:800;letter-spacing:-.02em}

.rec-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(139,106,67,.14);font-size:19px;line-height:1.45}
.rec-row:last-of-type{border-bottom:none}
.rec-k{flex:0 0 106px;color:var(--soil);font-weight:700}
.rec-v{flex:1;color:var(--ink);word-break:keep-all}
.rec-note{margin:6px 0 16px;font-size:18px;color:#8A7F68;line-height:1.5}
#recordBody{margin-bottom:14px}

.cook-stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 4px}
.cook-dots{display:flex;gap:8px;margin-bottom:10px}
.cook-dots i{display:block;width:12px;height:12px;border-radius:50%;background:#DCCFB2}
.cook-dots i.on{background:var(--leaf)}
.cook-kicker{font-size:20px;color:var(--soil);font-weight:700;letter-spacing:.04em}
.cook-emoji{font-size:76px;line-height:1.1;margin:6px 0}
.cook-line{font-size:24px;line-height:1.45;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.cook-memory{
  margin:14px 0 4px;padding:16px;border-radius:20px;background:#FFF6E0;
  border:2px solid #EEDCB2;font-size:21px;line-height:1.55;color:#5A4A30;text-align:left;
}
.cook-name{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.cook-btn{margin-top:16px}
.cook-secondary{margin-top:6px}

.day-card{text-align:center}
.day-emoji{font-size:56px}
.day-title{font-size:27px;font-weight:800;margin:6px 0 10px;letter-spacing:-.02em}
.day-lines{text-align:left;margin:0 0 6px;padding:0;list-style:none}
.day-lines li{
  font-size:21px;line-height:1.6;color:#4A4336;padding:9px 0;
  border-bottom:1px solid rgba(139,106,67,.14);
}
.day-lines li:last-child{border-bottom:none}
.season-card{text-align:center}
.season-big{font-size:72px;line-height:1.1;animation:ripeGlow 3s ease-in-out infinite}
.season-name{font-size:29px;font-weight:800;margin:8px 0 6px;letter-spacing:-.02em}
.season-line{font-size:21px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,18px);
  z-index:80;max-width:360px;width:calc(100% - 48px);
  padding:14px 18px;border-radius:18px;text-align:center;
  background:rgba(51,48,42,.93);color:#FDF7E9;font-size:20px;line-height:1.4;
  opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}


/* ═════════ 시간대별 하늘 · 해와 달의 반원 궤적 ═════════ */
.village,.map-scene,.garden-scene,.rice-scene,.stream-scene,.kitchen-scene,.store-scene{isolation:isolate}
.scene-tint{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:var(--tint,rgba(255,255,255,0));
  mix-blend-mode:multiply;
  transition:background 1.4s ease;
}
.app[data-sky="dawn"]{
  --sky-top:#C9DFF0; --sky-mid:#F2DCD2; --sky-low:#FBE6C4; --sky-haze:#FFF1D6;
  --sky-ink:#4A4034; --tint:rgba(255,205,180,.24);
}
.app[data-sky="day"]{
  --sky-top:#8CC6E9; --sky-mid:#C0E2F4; --sky-low:#E5F3E1; --sky-haze:#F7FCEC;
  --sky-ink:#33402E; --tint:rgba(205,232,248,.12);
}
.app[data-sky="dusk"]{
  --sky-top:#6F6894; --sky-mid:#E0966A; --sky-low:#F7BC70; --sky-haze:#FFD79A;
  --sky-ink:#4A2E22; --tint:rgba(255,158,92,.28);
}
.app[data-sky="night"]{
  --sky-top:#1C2749; --sky-mid:#33406B; --sky-low:#586489; --sky-haze:#7A85A6;
  --sky-ink:#F3EFE2; --tint:rgba(66,86,146,.30);
}
.sky-head{
  position:relative;overflow:hidden;flex:0 0 auto;
  height:clamp(130px,20vh,196px);
  margin:-16px -18px 14px;border-radius:0 0 26px 26px;
  background:linear-gradient(180deg,var(--sky-top,#8CC6E9) 0%,var(--sky-mid,#C0E2F4) 46%,
             var(--sky-low,#E5F3E1) 74%,var(--sky-haze,#F7FCEC) 100%);
  transition:background 1.4s ease;
  box-shadow:0 6px 14px rgba(90,70,40,.14);
}
.sky-head::before{
  content:"";position:absolute;left:0;right:0;bottom:10%;height:26%;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.42));
}
.sh-stars{
  position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;
  transition:opacity 1.4s ease;
  background-image:
    radial-gradient(2px 2px at 12% 26%,#fff,transparent 62%),
    radial-gradient(2px 2px at 26% 13%,#fff,transparent 62%),
    radial-gradient(1.5px 1.5px at 37% 31%,#fff,transparent 62%),
    radial-gradient(2px 2px at 51% 11%,#fff,transparent 62%),
    radial-gradient(1.5px 1.5px at 63% 27%,#fff,transparent 62%),
    radial-gradient(2px 2px at 77% 17%,#fff,transparent 62%),
    radial-gradient(1.5px 1.5px at 88% 33%,#fff,transparent 62%),
    radial-gradient(2px 2px at 44% 20%,#fff,transparent 62%);
}
.app[data-sky="night"] .sh-stars{opacity:.9;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.5}}
.sh-sun,.sh-moon{
  position:absolute;left:50%;bottom:14%;z-index:2;
  transform:translate(-50%,50%);pointer-events:none;
  transition:left 1.6s ease,bottom 1.6s ease,opacity 1.2s ease,width .5s ease,height .5s ease;
}
.sh-sun{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFFCEA,#FFD37A 58%,#F5A94B);
  box-shadow:0 0 30px rgba(255,196,110,.85);
}
.sh-moon{
  width:34px;height:34px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 36% 30%,#FFFDF2,#EDE8D4 62%,#D3CEB8);
  box-shadow:0 0 22px rgba(245,245,225,.75),0 0 0 5px rgba(255,255,255,.14);
}
.app[data-sky="dawn"] .sh-sun{
  width:40px;height:40px;
  background:radial-gradient(circle at 38% 32%,#FFF7E2,#FFD2A2 58%,#F5B279);
  box-shadow:0 0 34px rgba(255,200,150,.85);
}
.app[data-sky="dusk"] .sh-sun{
  width:52px;height:52px;
  background:radial-gradient(circle at 38% 32%,#FFF3CE,#FFB55E 52%,#EC7A38);
  box-shadow:0 0 46px rgba(255,150,70,.9);
}
.app[data-sky="night"] .sh-sun{opacity:0}
.app[data-sky="night"] .sh-moon{opacity:1}
.sh-hill{
  position:absolute;bottom:8%;z-index:3;height:18%;pointer-events:none;
  background:linear-gradient(180deg,rgba(158,180,138,.9),rgba(122,150,105,.96));
  border-radius:50% 62% 0 0/88% 100% 0 0;opacity:.75;
  transition:filter 1.4s ease;
}
.sh-hill.h1{left:-14%;width:78%}
.sh-hill.h2{right:-12%;width:66%;height:15%;opacity:.62}
.sh-ground{
  position:absolute;left:0;right:0;bottom:0;z-index:3;height:10%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(206,219,146,.96) 0 10px,rgba(186,201,122,.96) 10px 14px);
  border-top:2px solid rgba(143,167,104,.9);
}
.app[data-sky="night"] .sh-hill{filter:brightness(.55) saturate(.8)}
.app[data-sky="night"] .sh-ground{filter:brightness(.6) saturate(.7)}
.app[data-sky="dusk"] .sh-hill{filter:brightness(.85) sepia(.25)}
.app[data-sky="dusk"] .sh-ground{filter:brightness(.9) sepia(.2)}
.sh-bar{
  position:absolute;left:10px;right:10px;top:8px;z-index:4;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
}
.back--sky{
  margin:0;min-height:42px;padding:0 13px;font-size:17px;border-radius:13px;
  background:rgba(255,253,247,.9);border:1px solid rgba(255,255,255,.7);
  color:#5A4A32;box-shadow:0 2px 8px rgba(60,40,20,.2);
}
.back--sky:active{transform:translateY(2px);box-shadow:none}
.sh-info{
  font-size:15px;font-weight:800;letter-spacing:.01em;color:var(--sky-ink,#33402E);
  background:rgba(255,253,247,.88);border-radius:999px;padding:5px 11px;
  box-shadow:0 2px 8px rgba(60,40,20,.16);white-space:nowrap;
}
.app[data-sky="night"] .sh-info{background:rgba(24,32,58,.74);color:#F3EFE2}
.app[data-sky="night"] .back--sky{background:rgba(34,44,74,.8);color:#F3EFE2;border-color:rgba(255,255,255,.28)}

/* ───────── 해 질 녘 귀가 안내 ───────── */
.dusk-card{text-align:center}
.dusk-sky{
  position:relative;height:118px;border-radius:22px;overflow:hidden;margin:0 0 12px;
  background:linear-gradient(180deg,#5E5F8C 0%,#C98A63 38%,#F2B26B 68%,#FFD79A 100%);
  isolation:isolate;
}
.dusk-sun{
  position:absolute;right:16%;bottom:20%;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFF3CE,#FFAE55 52%,#E8702F);
  box-shadow:0 0 38px rgba(255,140,60,.85);
}
.dusk-hill{
  position:absolute;left:-10%;right:-10%;bottom:0;z-index:2;height:34%;
  background:linear-gradient(180deg,rgba(120,112,112,.35),rgba(88,82,78,.8));
  border-radius:50% 60% 0 0/90% 100% 0 0;
}
.dusk-big{font-size:40px;line-height:1.1}
.dusk-title{margin:2px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.35;color:#4A2E22}
.dusk-line{margin:0 0 16px;font-size:20px;line-height:1.5;color:var(--ink-soft)}

/* ───────── 기록 시트 · 시간대 테스트 ───────── */
.sky-test{
  margin:16px 0 6px;padding:12px 12px 10px;border-radius:18px;
  background:#FFFDF7;border:1px dashed rgba(139,106,67,.45);
}
.sky-test-k{margin:0 0 8px;font-size:16px;font-weight:800;color:var(--soil);letter-spacing:.02em}
.sky-test-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px}
.sky-test-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.sky-test-btn{
  min-height:44px;padding:0 4px;border-radius:12px;font-family:inherit;
  border:1px solid rgba(139,106,67,.3);background:#FFFBF0;
  font-size:15px;font-weight:700;color:#5A4A32;cursor:pointer;
}
.sky-test-btn:active{transform:translateY(1px)}
.sky-test-btn.is-on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sky-test-info{margin:2px 0 0;font-size:14px;line-height:1.45;color:#8A7F68}

/* ═════════ 바다 · 포구 (배 타고 나가기) ═════════ */
.map-sea{
  position:absolute;right:-8%;top:38%;width:36%;height:28%;z-index:2;pointer-events:none;
  border-radius:52% 0 0 52%/50% 0 0 50%;
  background:linear-gradient(160deg,#C6E7F0,#7FC3D6 58%,#55A0B8);
  box-shadow:inset 0 0 20px rgba(255,255,255,.55);
  opacity:.94;
}
.map-sea::after{
  content:"";position:absolute;left:12%;top:26%;width:54%;height:4px;border-radius:4px;
  background:rgba(255,255,255,.65);
  box-shadow:0 14px 0 rgba(255,255,255,.45),14px 28px 0 rgba(255,255,255,.5);
}
.sea-scene{
  position:relative;border-radius:26px;overflow:hidden;min-height:326px;
  border:4px solid #C6B293;isolation:isolate;
  background:
    radial-gradient(ellipse at 30% 8%, rgba(255,255,255,.5), rgba(255,255,255,0) 42%),
    linear-gradient(#D9EFF4 0%,#A9DCE7 26%,#6FB9CE 62%,#3E8CA8 100%);
}
.sea-sun{
  position:absolute;right:26px;top:20px;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFFCEA,#FFD37A 58%,#F5A94B);
  box-shadow:0 0 34px rgba(255,196,110,.8);
}
.sea-far{
  position:absolute;left:-8%;right:-8%;top:34%;height:13%;z-index:0;opacity:.9;
  background:
    radial-gradient(ellipse at 18% 100%, #8FAE78 0 58%, rgba(143,174,120,0) 60%),
    radial-gradient(ellipse at 54% 100%, #A6BF8C 0 52%, rgba(166,191,140,0) 54%),
    radial-gradient(ellipse at 86% 100%, #96B57E 0 60%, rgba(150,181,126,0) 62%);
}
.sea-cloud{position:absolute;height:20px;border-radius:50%;background:rgba(255,255,255,.88);filter:blur(.5px)}
.sea-cloud.c1{left:10%;top:12%;width:72px}
.sea-cloud.c2{left:56%;top:7%;width:52px;height:16px;opacity:.8}
.sea-cloud::after{content:"";position:absolute;left:16%;top:60%;width:60%;height:70%;border-radius:50%;background:inherit}
.sea-wave{position:absolute;left:-10%;right:-10%;height:12px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
.sea-wave.w1{bottom:36%;animation:waveDrift 5.4s ease-in-out infinite}
.sea-wave.w2{bottom:24%;opacity:.45;animation:waveDrift 6.8s ease-in-out infinite reverse}
.sea-wave.w3{bottom:12%;opacity:.35;animation:waveDrift 8s ease-in-out infinite}
@keyframes waveDrift{0%,100%{transform:translateX(0) scaleX(1)}50%{transform:translateX(16px) scaleX(1.05)}}
.sea-dock{
  position:absolute;left:0;bottom:0;width:24%;height:20%;
  background:repeating-linear-gradient(0deg,#B08A5F 0 11px,#98724A 11px 14px);
  border-right:4px solid #8B6A43;border-top-right-radius:8px;opacity:.95;
}
.sea-dock::after{
  content:"";position:absolute;right:-30px;top:8px;width:30px;height:7px;border-radius:3px;
  background:#8B6A43;box-shadow:0 20px 0 #8B6A43;
}
.sea-gull{position:absolute;right:24%;top:24%;font-size:26px;animation:bob 4.4s ease-in-out infinite}
.sea-boat{position:absolute;left:50%;bottom:9%;width:156px;transform:translateX(-50%);animation:boatRock 3.8s ease-in-out infinite}
.sea-boat.is-docked{left:34%;bottom:9%;width:126px;animation:boatRock 4.8s ease-in-out infinite}
@keyframes boatRock{
  0%,100%{transform:translateX(-50%) rotate(-1.6deg)}
  50%{transform:translateX(-50%) rotate(1.6deg) translateY(-3px)}
}
.sea-boat .b-hull{
  position:relative;display:block;width:100%;height:46px;
  background:
    repeating-linear-gradient(90deg, rgba(110,82,51,.22) 0 2px, rgba(255,255,255,0) 2px 24px),
    linear-gradient(#C39A6A,#8B6A43);
  border-radius:10px 10px 70px 70px/10px 10px 46px 46px;
  border-bottom:5px solid #6E5233;box-shadow:0 6px 12px rgba(20,60,80,.35);
}
.sea-boat .b-hull::before{
  content:"";position:absolute;left:-3px;right:-3px;top:-5px;height:11px;border-radius:7px;
  background:linear-gradient(#D8B384,#AA8055);border-bottom:2px solid rgba(110,82,51,.35);
}
.sea-boat .b-hull::after{
  content:"";position:absolute;left:12%;right:12%;top:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);
}
.sea-boat .b-oar{
  position:absolute;left:-18px;bottom:28px;width:56px;height:8px;border-radius:6px;background:#A9805A;
  transform:rotate(22deg);transform-origin:right center;
}
.sea-boat .b-kid{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);height:64px;display:block}
.sea-boat .b-kid .kid-img{height:100%;width:auto}
.sea-target{
  position:absolute;z-index:4;width:92px;height:92px;margin:-46px 0 0 -46px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:none;font-size:48px;cursor:pointer;padding:0;
  filter:drop-shadow(0 4px 5px rgba(10,50,70,.42));
  animation:seaPop 2.2s ease-in-out infinite;
}
@keyframes seaPop{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
.sea-target::after{
  content:"";position:absolute;left:6px;right:6px;bottom:2px;height:12px;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);
}
.sea-hud{
  display:flex;justify-content:space-between;gap:8px;align-items:center;
  margin:0 0 8px;padding:0 4px;font-size:20px;font-weight:700;color:#2F5766;
}
.btn--sea{background:linear-gradient(#83C6DB,#4E9AB8);color:#08303F;box-shadow:0 5px 0 #3B7E99}

/* ═════════ 이웃집 마실 · 서리 · 옛날 벌칙 ═════════ */
.nb-scene{
  position:relative;border-radius:26px;overflow:hidden;padding:14px 14px 16px;
  border:1px solid rgba(139,106,67,.25);isolation:isolate;
  background:linear-gradient(#EDF5DA,#DDE9C2 50%,#CBDBA6);
}
.nb-scene.is-away{background:linear-gradient(#F6F8E1,#EAF1CB 50%,#DCE7B2)}
.nb-owner{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;
  background:rgba(255,253,247,.92);border:1px solid rgba(139,106,67,.2);
}
.nb-face{font-size:46px;line-height:1}
.nb-talk{display:flex;flex-direction:column;gap:2px;min-width:0}
.nb-talk b{font-size:21px;color:#5A4022}
.nb-talk span{font-size:18px;color:#6D6350;line-height:1.35}
.watch-banner{
  margin:10px 0;padding:10px 14px;border-radius:16px;text-align:center;
  font-size:20px;font-weight:800;letter-spacing:-.01em;border:2px solid transparent;
  word-break:keep-all;line-height:1.4;
  transition:background .3s ease,color .3s ease;
}
.watch-banner.is-watch{background:#E8EEF7;color:#3C4E68;border-color:#C7D5E8}
.watch-banner.is-away{background:#FFF2C9;color:#8A5A10;border-color:#EED79A;animation:pulseAway 1.6s ease-in-out infinite}
@keyframes pulseAway{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.nb-crops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nb-crop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:114px;padding:8px;border-radius:20px;border:2px dashed rgba(139,106,67,.35);
  background:radial-gradient(circle at 50% 40%,#F8F4E0,#E4ECC8);
  font-family:inherit;color:#3E4B32;cursor:pointer;transition:box-shadow .3s ease,transform .12s ease;
}
.nb-crop:active{transform:scale(.97)}
.nb-crop .nc-emoji{font-size:44px;line-height:1}
.nb-crop .nc-name{font-size:19px;font-weight:800}
.nb-scene.is-away .nb-crop{box-shadow:0 0 0 3px rgba(255,226,140,.85),0 0 22px rgba(255,206,110,.7)}
.nb-caught{text-align:center;padding:6px 0 2px}
.nc-face{font-size:62px;line-height:1;animation:popIn .5s ease both}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.nc-title{margin:6px 0 4px;font-size:27px;font-weight:800;color:#7C4B2A;letter-spacing:-.02em}
.nc-line{margin:0 0 6px;font-size:21px;line-height:1.5;color:#4A4336}
.nc-sub{margin:0;font-size:19px;color:#8A7F68;line-height:1.45;word-break:keep-all}
.ns-line{margin:0;font-size:20px;color:var(--ink-soft);line-height:1.5;word-break:keep-all}
.pen-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pen-card{
  display:flex;align-items:center;gap:14px;min-height:86px;padding:12px 16px;border-radius:20px;
  border:2px solid var(--line);background:var(--white);cursor:pointer;text-align:left;
  box-shadow:0 3px 0 rgba(139,106,67,.1);font-family:inherit;color:inherit;
}
.pen-card:active{transform:translateY(2px);box-shadow:none}
.pen-card .pc-emoji{font-size:34px}
.pen-card .pc-name{font-size:22px;font-weight:800;letter-spacing:-.01em}
.pen-card .pc-sub{font-size:18px;color:#8A7F68;margin-left:auto;text-align:right;white-space:nowrap;flex:0 0 auto}
.pen-note{margin:0 0 10px;font-size:18px;color:#8A7F68;line-height:1.4}
.pen-stage{text-align:center;padding:8px 0}
.pen-emoji{font-size:72px;line-height:1;animation:penMove 1.1s ease-in-out infinite}
@keyframes penMove{0%,100%{transform:translateX(-8px) rotate(-6deg)}50%{transform:translateX(8px) rotate(6deg)}}
.pen-name{margin:6px 0 2px;font-size:25px;font-weight:800;letter-spacing:-.02em}
.pen-line{margin:0 0 12px;font-size:20px;color:var(--ink-soft);line-height:1.5}
.pen-dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.pen-dots i{display:block;width:16px;height:16px;border-radius:50%;background:#DCCFB2}
.pen-dots i.on{background:var(--leaf)}
.pen-count{font-size:22px;font-weight:800;color:#5A4022}
.nb-sorry{text-align:center;padding:4px 0}
.ns-face{font-size:56px;line-height:1;animation:popIn .5s ease both}
.ns-title{margin:8px 0 6px;font-size:24px;font-weight:800;color:#5A4022;line-height:1.4;letter-spacing:-.02em;word-break:keep-all}
.btn--steal{background:linear-gradient(#E8B75C,#D29A3C);color:#4A3208;box-shadow:0 5px 0 #B27F2A}

/* ═════════ 장터 (엽전 · 팔기 · 사기) ═════════ */
.wallet{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-radius:20px;border:2px solid #E4CE96;
  background:linear-gradient(#FFF7DE,#F6E6BD);font-size:21px;font-weight:800;color:#6E5233;
}
.wallet b{font-size:27px;letter-spacing:-.01em}
.sec-title{
  margin:16px 0 8px;font-size:21px;font-weight:800;color:var(--soil-deep);
  letter-spacing:-.01em;display:flex;align-items:center;gap:8px;
}
.sell-grid{display:flex;flex-direction:column;gap:10px}
.sell-chip{
  display:flex;align-items:center;gap:10px;min-height:68px;padding:8px 14px;border-radius:18px;
  border:2px solid var(--line);background:var(--white);text-align:left;cursor:pointer;
  font-family:inherit;color:#4A4336;box-shadow:0 3px 0 rgba(139,106,67,.1);
}
.sell-chip:active{transform:translateY(2px);box-shadow:none}
.sell-chip .sc-emoji{font-size:28px;line-height:1;flex:0 0 auto}
.sell-chip .sc-name{font-size:21px;font-weight:800;white-space:nowrap}
.sell-chip .sc-count{font-size:18px;color:#8A7F68;white-space:nowrap}
.sell-chip .sc-price{margin-left:auto;font-size:19px;font-weight:800;color:#9A7A3A;white-space:nowrap;flex:0 0 auto}
.store-empty{
  margin:0;padding:14px 16px;border-radius:18px;background:#FFFDF7;
  border:1px dashed rgba(139,106,67,.4);font-size:19px;line-height:1.5;color:var(--ink-soft);
}
.buy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.buy-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:96px;padding:10px 12px;
  border-radius:18px;border:2px solid #E4CE96;background:linear-gradient(#FFFDF7,#FBF2DC);
  text-align:left;cursor:pointer;font-family:inherit;color:#4A3A20;box-shadow:0 3px 0 rgba(139,106,67,.1);
}
.buy-card:active{transform:translateY(2px);box-shadow:none}
.buy-card .bc-top{display:flex;align-items:center;gap:8px;width:100%}
.buy-card .bc-emoji{font-size:26px;line-height:1}
.buy-card .bc-name{font-size:20px;font-weight:800}
.buy-card .bc-price{margin-left:auto;font-size:18px;font-weight:800;color:#8A5A10}
.buy-card .bc-sub{font-size:17px;color:#8A7F68;line-height:1.35}

/* ═════════ 센터 모둠 테스트 ═════════ */
.group-test{
  margin:16px 0 6px;padding:12px;border-radius:18px;
  background:#F2F7E8;border:1px dashed rgba(110,142,78,.55);
}
.gt-title{margin:0 0 8px;font-size:17px;font-weight:800;color:#4F6B37;letter-spacing:.02em}
.gt-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.gt-btn{
  min-height:54px;padding:4px 6px;border-radius:14px;border:1px solid rgba(139,106,67,.3);
  background:#FFFDF7;font-family:inherit;font-size:17px;font-weight:700;color:#3E4B32;
  line-height:1.25;cursor:pointer;
}
.gt-btn:active{transform:translateY(1px)}
.dish-tag{
  display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
  font-size:15px;font-weight:700;color:#8A6A2E;background:#F6E4B8;vertical-align:middle;
}

@media (max-width:360px){
  .q{font-size:26px}
  .greet{font-size:25px}
  .btn{font-size:22px}
  .acts{gap:10px}
  .act{min-height:144px;padding:14px 12px}
  .act-name{font-size:21px}
  .act-sub{font-size:18px}
  .village{height:196px}
  .rice-scene{height:300px}
  .btn--plant{font-size:24px;min-height:82px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnRecords" data-act="records-open" aria-label="가족·테스트 기록 보기">📋</button>
    <div class="brand">기억의 텃밭</div>
    <button class="icon-btn" id="btnSound" data-act="sound-toggle" aria-label="소리 끄기" aria-pressed="true">🔊</button>
  </header>

  <div id="screens">
    <!-- 1. 온보딩 ① -->
    <section class="screen" data-screen="hello">
      <div class="village" aria-hidden="true">
        <span class="scene-tint"></span>
        <div class="v-mtn"></div>
        <div class="v-mtn b"></div>
        <div class="v-sun"></div>
        <div class="v-paddy"><span class="v-rice">🌾🌾🌾🌾🌾🌾🌾🌾🌾🌾🌾🌾🌾🌾</span></div>
        <div class="v-house">
          <span class="v-roof"></span><span class="v-ridge"></span>
          <span class="v-wall"></span><span class="v-door"></span><span class="v-window"></span>
        </div>
        <div class="v-smoke"><i></i><i></i><i></i></div>
        <div class="v-yard">🏺🏺🏺</div>
        <div class="v-tree">🌳</div>
        <div class="v-creek"></div>
      </div>
      <p class="call-line">아이고, 우리 강아지 왔구나!</p>
      <h1 class="q">어릴 적 어머님·아버님이<br>뭐라고 부르셨니?</h1>
      <label class="field-label" for="nameInput">여기에 이름을 적어 주세요</label>
      <input class="name-input" id="nameInput" type="text" inputmode="text" autocomplete="off"
             maxlength="8" placeholder="순이" aria-label="어릴 적 불리던 이름">
      <div class="chips" id="nameChips">
        <button class="chip" data-act="name-chip" data-name="순이">순이야</button>
        <button class="chip" data-act="name-chip" data-name="영희">영희야</button>
        <button class="chip" data-act="name-chip" data-name="복남">복남아</button>
        <button class="chip" data-act="name-chip" data-name="막내">막내야</button>
      </div>
      <button class="btn btn--primary btn--xl" data-act="name-next">다음</button>
      <button class="btn-link" data-act="name-skip">그냥 시작할게요</button>
    </section>

    <!-- 2. 온보딩 ② -->
    <section class="screen" data-screen="town">
      <div style="height:6px"></div>
      <h1 class="q">우리 집에서<br>가장 많이 놀던 곳은?</h1>
      <p class="sub">한 곳만 골라 주세요. 풍경이 그쪽으로 바뀐단다.</p>
      <div class="town-grid" id="townGrid">
        <button class="town-card" data-act="town-pick" data-town="paddy">
          <span class="tw-emoji">🌾</span><span class="tw-name">논두렁</span><span class="tw-sub">너른 논</span>
        </button>
        <button class="town-card" data-act="town-pick" data-town="creek">
          <span class="tw-emoji">🏞️</span><span class="tw-name">집 앞 냇가</span><span class="tw-sub">징검다리, 다슬기</span>
        </button>
        <button class="town-card" data-act="town-pick" data-town="field">
          <span class="tw-emoji">🥔</span><span class="tw-name">산자락 밭</span><span class="tw-sub">감자·고구마 밭</span>
        </button>
        <button class="town-card" data-act="town-pick" data-town="village">
          <span class="tw-emoji">🏘️</span><span class="tw-name">동네 길</span><span class="tw-sub">구멍가게, 마당</span>
        </button>
      </div>
      <button class="btn btn--primary btn--xl" id="btnTownNext" data-act="town-next" disabled>여기가 제일 좋아요</button>

function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
/* 받침에 따라 조사를 골라 준다 (예: 할머니가 / 영감님이) */
function josa(word, withB, withoutB){
  var s = String(word === undefined || word === null ? '' : word);
  if (!s) return withoutB;
  var c = s.charCodeAt(s.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return withoutB;
  return ((c - 0xAC00) % 28 === 0) ? withoutB : withB;
}
function sI(word){ return josa(word, '이', '가'); }
function sEul(word){ return josa(word, '을', '를'); }
function sRo(word){
  var s = String(word === undefined || word === null ? '' : word);
  if (!s) return '로';
  var c = s.charCodeAt(s.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return '로';
  var jong = (c - 0xAC00) % 28;
  return (jong === 0 || jong === 8) ? '로' : '으로';
}
function fmtNow(){
  var d = new Date();
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function todayLabel(){
  var d = new Date();

function defer(fn, ms){
  if (typeof setTimeout === 'function'){ setTimeout(fn, ms || 0); } else { fn(); }
}
function nowMs(){
  try{
    if (typeof window !== 'undefined' && window.performance && window.performance.now){
      return window.performance.now();
    }
  }catch(e){}
  return Date.now();
}
function raf(fn){
  if (typeof window !== 'undefined' && window.requestAnimationFrame) return window.requestAnimationFrame(fn);
  if (typeof setTimeout === 'function') return setTimeout(fn, 16);
  return null;
}
function cancelRaf(h){
  if (h === null || h === undefined) return;
  try{
    if (typeof window !== 'undefined' && window.cancelAnimationFrame) window.cancelAnimationFrame(h);
  }catch(e){}
  try{ if (typeof clearTimeout === 'function') clearTimeout(h); }catch(e){}
}

/* ═════════════════════════════════════════
   3-b. 시간대별 하늘 · 해와 달 · 놀이 시간
   ═════════════════════════════════════════ */
function clockHours(){
  var d = new Date();
  return d.getHours() + d.getMinutes() / 60;
}
function playMinutes(){
  if (!state.playStartMs) return 0;
  if (state.playStartDay && state.playStartDay !== todayLabel()) return 0;
  return Math.max(0, Math.floor((Date.now() - state.playStartMs) / 60000));
}
function startPlayClock(){
  state.playStartMs = Date.now();
  state.playStartDay = todayLabel();
}
function overHour(){ return playMinutes() >= 60; }
function sunArcT(h){
  var t = (h - 6) / 13;                    /* 6시 지평선 → 19시 지평선 */
  return Math.max(0, Math.min(1, t));
}
function moonArcT(h){
  var hh = (h < 6) ? h + 24 : h;           /* 19:30 ~ 다음날 05:00 */
  var t = (hh - 19.5) / 9.5;
  return Math.max(0, Math.min(1, t));
}
function skyInfo(){
  var h = clockHours();
  var over = overHour();
  var key = '', sunT = sunArcT(h), moonT = moonArcT(h);
  if (state.skyOverride){
    key = state.skyOverride;
    if (key === 'dawn') sunT = 0.10;
    else if (key === 'day') sunT = 0.52;
    else if (key === 'dusk') sunT = 0.90;
    else if (key === 'night') moonT = 0.45;
  } else if (over){
    key = 'dusk'; sunT = 0.93;             /* 한 시간이 넘으면 해가 오른쪽으로 저문다 */
  } else if (h >= 5 && h < 7.5){
    key = 'dawn';
  } else if (h >= 7.5 && h < 16.5){
    key = 'day';
  } else if (h >= 16.5 && h < 19.5){
    key = 'dusk';
  } else {
    key = 'night';
  }
  return { key:key, name:SKY_NAME[key], sunT:sunT, moonT:moonT, over:over };
}
/* 하늘 안 반원(아치) 궤적: 왼쪽 지평선 → 정점 → 오른쪽 지평선 */
function skyOrbStyle(t){
  t = Math.max(0, Math.min(1, t));
  var x = 6 + 88 * t;
  var y = 14 + Math.sin(Math.PI * t) * 66;
  return 'left:' + x.toFixed(2) + '%;bottom:' + y.toFixed(2) + '%';
}
function skyPaintOrbs(s){
  s = s || skyInfo();
  var suns = document.querySelectorAll('.sh-sun');
  var i;
  for (i = 0; i < suns.length; i++){ if (suns[i].setAttribute) suns[i].setAttribute('style', skyOrbStyle(s.sunT)); }
  var moons = document.querySelectorAll('.sh-moon');
  for (i = 0; i < moons.length; i++){ if (moons[i].setAttribute) moons[i].setAttribute('style', skyOrbStyle(s.moonT)); }
}
function skyApply(){
  var s = skyInfo();

}

/* ═════════════════════════════════════════
   4. 소리 (Web Audio · 외부 파일 없음)
   ═════════════════════════════════════════ */
var Sound = (function(){
  var ctx = null, master = null, enabled = true, radioIdx = 0;

  function AC(){
    if (typeof window === 'undefined') return null;
    return window.AudioContext || window.webkitAudioContext || null;
  }
  function ensure(){
    if (!enabled) return null;
    var C = AC();
    if (!C) return null;
    if (ctx){
      if (ctx.state === 'suspended' && ctx.resume){ try{ ctx.resume(); }catch(e){} }
      return ctx;
    }
    try{ ctx = new C(); }catch(e){ return null; }
    try{
      master = ctx.createGain();
      master.gain.value = 0.2;
      master.connect(ctx.destination);
    }catch(e){ return null; }
    return ctx;
  }
  function tone(f, at, dur, type, peak){
    var c = ensure(); if (!c) return;
    try{
      var t0 = c.currentTime + (at || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak || 0.28, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.06);
    }catch(e){}
  }
  function noise(at, dur, f1, f2, peak, q){
    var c = ensure(); if (!c) return;
    try{
      var t0 = c.currentTime + (at || 0);
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = c.createBufferSource(); src.buffer = buf;
      var filt = c.createBiquadFilter();
      filt.type = 'bandpass'; filt.Q.value = q || 1.2;
      filt.frequency.setValueAtTime(f1, t0);
      filt.frequency.exponentialRampToValueAtTime(Math.max(120, f2), t0 + dur);
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak || 0.22, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filt); filt.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }catch(e){}
  }

  return {
    setOn:function(v){
      enabled = !!v;
      if (enabled) ensure();
      if (master){ try{ master.gain.value = enabled ? 0.2 : 0; }catch(e){} }
    },
    isOn:function(){ return enabled; },

    click:function(){ tone(700,0,0.09,'sine',0.16); tone(1050,0.01,0.06,'sine',0.07); },
    page:function(){ noise(0,0.22,900,320,0.1,0.8); },
    name:function(){ tone(659,0,0.12,'sine',0.16); tone(880,0.09,0.16,'sine',0.12); },
    till:function(){ noise(0,0.2,430,170,0.2,1.0); tone(170,0.02,0.14,'triangle',0.1); },
    seed:function(){ tone(520,0,0.1,'sine',0.15); tone(780,0.08,0.12,'sine',0.11); },
    plant:function(){ /* 논에 모 심는 찰박 */ noise(0,0.16,760,300,0.16,0.9); tone(660,0.02,0.13,'sine',0.13); },
    plop:function(){ noise(0.1,0.22,520,240,0.1,1.1); },
    soft:function(){ /* 따뜻한 낮은 음 — 경고음 아님 */ tone(392,0,0.24,'sine',0.1); tone(330,0.16,0.34,'sine',0.08); },
    step:function(){ tone(240 + Math.random()*90,0,0.05,'sine',0.045); },
    water:function(){
      for (var i = 0; i < 4; i++) tone(560 + Math.random()*340, i*0.09, 0.17, 'sine', 0.15);
      noise(0,0.55,1300,420,0.1,1.6);
    },
    harvest:function(){
      [523.25,659.25,783.99].forEach(function(f,i){ tone(f, i*0.09, 0.3, 'triangle', 0.2); });
      tone(1046.5,0.3,0.42,'sine',0.12);
    },
    catchIt:function(){ tone(880,0,0.08,'sine',0.17); tone(1320,0.06,0.11,'sine',0.1); },
    candy:function(){ tone(1180,0,0.05,'triangle',0.07); tone(1560,0.05,0.05,'triangle',0.05); },
    fire:function(){ noise(0,0.7,760,190,0.2,0.7); tone(110,0.04,0.45,'sawtooth',0.04); },
    done:function(){
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f, i*0.12, 0.72, 'sine', 0.18); });
      tone(392,0.1,0.9,'triangle',0.08);
    },
    season:function(){ [659.25,783.99,987.77,1318.5].forEach(function(f,i){ tone(f, i*0.16, 1.1, 'sine', 0.15); }); },
    radio:function(){
      var mel = RADIO_MELODIES[radioIdx % RADIO_MELODIES.length];

   6-b. 마을 지도 · 걸어가기

function polyLen(pts){
  var d = 0;
  if (!pts) return 0;
  for (var i = 1; i < pts.length; i++){
    d += Math.sqrt(Math.pow(pts[i][0]-pts[i-1][0], 2) + Math.pow(pts[i][1]-pts[i-1][1], 2));
  }
  return d;
}
function polyAt(pts, s){
  if (!pts || !pts.length) return { x: MAP_HOME.x, y: MAP_HOME.y };
  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };
  var acc = 0, i, seg, f;
  for (i = 1; i < pts.length; i++){
    seg = Math.sqrt(Math.pow(pts[i][0]-pts[i-1][0], 2) + Math.pow(pts[i][1]-pts[i-1][1], 2));
    if (acc + seg >= s || i === pts.length - 1){
      f = seg > 0 ? (s - acc) / seg : 0;
      if (f < 0) f = 0;
      if (f > 1) f = 1;
      return {
        x: pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * f,
        y: pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * f
      };
    }
    acc += seg;
  }
  return { x: pts[pts.length-1][0], y: pts[pts.length-1][1] };
}
function mapKidPoint(key){
  var road = MAP_ROADS[key];
  if (!road) return { x: MAP_HOME.x, y: MAP_HOME.y };
  return polyAt(road, polyLen(road) * KID_STOP);
}
function mapWalkPath(fromKey, toKey){
  var path = [], i, j;
  var start = mapKidPoint(fromKey);
  path.push([start.x, start.y]);
  if (MAP_ROADS[fromKey]){
    var back = MAP_ROADS[fromKey].slice().reverse();
    for (i = 1; i < back.length; i++) path.push(back[i]);
  } else {
    path.push([MAP_HOME.x, MAP_HOME.y]);
  }
  var road = MAP_ROADS[toKey] || [];
  for (j = 1; j < road.length; j++) path.push(road[j]);
  var end = mapKidPoint(toKey);
  path.push([end.x, end.y]);
  return path;
}
function mapSyncFromState(){
  var k = state.lastSpot || '';
  mapPos.key = MAP_ROADS[k] ? k : '';
  var p = mapKidPoint(mapPos.key);
  mapPos.x = p.x;
  mapPos.y = p.y;
}
function mapNodeHTML(k){
  var s = MAP_SPOTS[k];
  var sub = actSub(k);
  var label = s.name + (sub ? ' (' + sub + ')' : '');
  return '<button class="map-node' + (mapPos.key === k ? ' is-here' : '') + '"' +

}
function mapDogIdle(){
  return { x: mapPos.x - 4.6, y: mapPos.y + 1.4 };
}
function mapHTML(){
  var nodes = '', i;
  for (i = 0; i < MAP_ORDER.length; i++) nodes += mapNodeHTML(MAP_ORDER[i]);
  var dog = walk.active ? { x: mapPos.x, y: mapPos.y } : mapDogIdle();
  return '<div class="map-wrap">' +

        ' style="left:' + dog.x.toFixed(2) + '%;top:' + dog.y.toFixed(2) + '%">' + DOG_IMG + '</div>' +
      '<div class="map-kid' + (walk.active ? ' is-walking' : '') + '" id="mapKid"' +
        ' style="left:' + mapPos.x.toFixed(2) + '%;top:' + mapPos.y.toFixed(2) + '%">' + KID_IMG + '</div>' +
    '</div>' +
    '<p class="map-note">가고 싶은 곳을 톡 누르면, 강아지랑 오솔길로 총총 걸어간단다.</p>' +
  '</div>';
}
function mapFootDots(p){
  var t = nowMs();
  if (walk.lastDot && t - walk.lastDot < MAP_DOT_MS) return;
  walk.lastDot = t;
  var layer = el('mapDots');
  if (!layer || typeof document === 'undefined' || !document.createElement) return;
  var dot = document.createElement('i');
  dot.className = 'map-step';
  if (dot.style){
    dot.style.left = p.x.toFixed(2) + '%';
    dot.style.top = p.y.toFixed(2) + '%';
  }
  if (layer.appendChild) layer.appendChild(dot);
  Sound.step();
  defer(function(){
    if (dot && dot.parentNode && dot.parentNode.removeChild) dot.parentNode.removeChild(dot);
  }, 950);
}
function mapWalkTick(){
  if (!walk.active) return;
  var kid = el('mapKid');
  if (!kid){ mapWalkEnd(); return; }
  var t = (nowMs() - walk.t0) / MAP_WALK_MS;
  if (t > 1) t = 1;
  var d = walk.len * t;
  var p = polyAt(walk.path, d);
  var back = (typeof walk.lastX === 'number') ? (p.x - walk.lastX) : 0;
  walk.lastX = p.x;
  mapPos.x = p.x;
  mapPos.y = p.y;
  var left = back < -0.03;
  if (kid.style){
    kid.style.left = p.x.toFixed(2) + '%';
    kid.style.top = p.y.toFixed(2) + '%';
  }
  if (kid.classList) kid.classList.toggle('is-left', left);
  var dog = el('mapDog');
  if (dog){
    var dp = polyAt(walk.path, Math.max(0, d - DOG_GAP));
    if (dog.style){
      dog.style.left = dp.x.toFixed(2) + '%';
      dog.style.top = dp.y.toFixed(2) + '%';
    }
    if (dog.classList) dog.classList.toggle('is-left', left);
  }
  mapFootDots(p);
  if (t >= 1){ mapWalkEnd(); return; }
  walk.timer = raf(mapWalkTick);
}
function mapWalkEnd(){
  walk.active = false;
  if (walk.timer !== null){ cancelRaf(walk.timer); walk.timer = null; }
  var kid = el('mapKid');
  if (kid && kid.classList){ kid.classList.remove('is-walking'); kid.classList.remove('is-left'); }
  var dog = el('mapDog');
  if (dog && dog.classList){ dog.classList.remove('is-walking'); dog.classList.remove('is-left'); }
  var target = walk.target;
  walk.target = '';
  if (!target) return;
  mapPos.key = target;
  var p = mapKidPoint(target);
  mapPos.x = p.x;
  mapPos.y = p.y;
  placeGo(target);
}
function mapWalk(kind){
  if (walk.active) return;
  if (!MAP_ROADS[kind]) return;
  var path = mapWalkPath(mapPos.key, kind);
  var len = polyLen(path);
  if (len < 0.5){ placeGo(kind); return; }
  walk.active = true;
  walk.target = kind;
  walk.path = path;
  walk.len = len;
  walk.t0 = nowMs();
  walk.lastDot = 0;
  walk.lastX = null;
  var kid = el('mapKid');
  if (kid && kid.classList) kid.classList.add('is-walking');
  var dog0 = el('mapDog');
  if (dog0 && dog0.classList) dog0.classList.add('is-walking');
  Sound.click();
  mapWalkTick();
}
function placeGo(kind){
  state.lastSpot = kind;
  saveState();
  if (kind === 'garden') openGarden();
  else if (kind === 'stream') openStream();
  else if (kind === 'kitchen') openKitchen();
  else if (kind === 'store') openStore();
  else if (kind === 'sea') openSea();
  else if (kind === 'neighborA' || kind === 'neighborB') openNeighbor(kind);
}
function mapGo(kind){
  if (walk.active) return;
  bump();
  if (!MAP_ROADS[kind]) return;
  if (mapPos.key === kind){ Sound.click(); placeGo(kind); return; }
  mapWalk(kind);
}

function openRice(){

function riceStart(){
  riceStop();
  riceGame = { phase:'aim', idx:0, marks:[], y:0, showY:null, running:false, timer:null, t0:0, yield:0 };
  state.rice.runs++;
  bump(); saveState();
  Sound.seed(); buzz();
  paint();
  riceFallStart();
}
function riceFallStart(){
  riceStop();
  riceGame.y = 0;
  riceGame.t0 = nowMs();
  riceGame.running = true;
  ricePaintDrop(0);
  riceGame.timer = raf(riceStep);
}
function riceStep(){
  if (!riceGame.running) return;
  var p = (nowMs() - riceGame.t0) / RICE_FALL_MS;
  if (p > 1) p = 1;
  riceGame.y = p;
  ricePaintDrop(p);
  if (p >= 1){ riceGame.running = false; riceGame.timer = null; riceLand(true, 1); return; }
  riceGame.timer = raf(riceStep);
}
function ricePaintDrop(p){
  var d = el('riceDrop');
  if (d && d.style) d.style.top = (p*100).toFixed(2) + '%';
  var on = Math.abs(p - RICE_TARGET) <= (RICE_BAND/2);
  var band = el('riceBand');
  if (band && band.classList) band.classList.toggle('is-hot', on);
  var btn = el('ricePlantBtn');
  if (btn && btn.classList) btn.classList.toggle('is-hot', on);
}
function ricePlantTap(){
  if (riceGame.phase !== 'aim' || !riceGame.running) return;
  riceGame.running = false;
  riceStop();
  riceLand(false, riceGame.y);
}
function riceLand(auto, p){
  var onLine = (!auto) && Math.abs(p - RICE_TARGET) <= (RICE_BAND/2);
  var clamped = Math.max(0.2, Math.min(0.92, p));
  bump(); saveState();
  if (onLine){
    Sound.plant(); Sound.plop(); buzz();
    riceGame.marks[riceGame.idx] = 'straight';
    riceGame.idx++;
    state.rice.plots++; state.rice.straight++; state.today.rice++;
    riceGame.showY = null;
    paint();
    toast('줄에 딱 맞게 심었어요!');
    defer(riceNext, 900);
  } else {
    Sound.soft(); buzz();
    riceGame.phase = 'choice';
    riceGame.showY = clamped;
    paint();
    toast('아이고, 줄이 조금 비뚤어졌구나!');
  }
}
function riceNext(){
  if (riceGame.phase === 'choice') return;
  if (riceGame.idx >= RICE_ROWS){
    riceGame.phase = 'grow';
    riceGame.showY = null;
    paint();
    return;
  }
  riceGame.phase = 'aim';
  paint();
  if (riceOnScreen()) riceFallStart();
}
function riceRetry(){
  if (riceGame.phase !== 'choice') return;
  state.rice.retry++;
  riceGame.phase = 'aim';
  riceGame.showY = null;
  bump(); saveState();
  Sound.soft();
  paint();
  defer(function(){ if (riceGame.phase === 'aim' && riceOnScreen()) riceFallStart(); }, 260);
}
function riceKeep(){
  if (riceGame.phase !== 'choice') return;
  state.rice.keep++;
  riceGame.marks[riceGame.idx] = 'crooked';
  riceGame.idx++;
  state.rice.plots++; state.rice.crooked++; state.today.rice++;
  riceGame.phase = 'aim';
  riceGame.showY = null;
  bump(); saveState();
  Sound.soft();
  if (riceGame.idx >= RICE_ROWS){ riceGame.phase = 'grow'; paint(); return; }
  paint();
  defer(function(){ if (riceGame.phase === 'aim' && riceOnScreen()) riceFallStart(); }, 320);
}
function riceHarvest(){
  if (riceGame.phase !== 'grow') return;
  var st = riceCount('straight');
  var cr = riceCount('crooked');
  var y = riceYield();
  addItem('rice', y);
  state.rice.harvest += y;
  state.rice.lastYield = y;
  state.stats.harvest += y;
  riceGame.phase = 'done';
  riceGame.yield = y;
  bump(); saveState();
  Sound.harvest(); buzz();
  paint();
  defer(function(){ Sound.done(); }, 320);
  toast('벼 ' + y + '개를 바구니에 담았어요');
}

  state.stats.sold++; state.today.sold++; state.market.sold++;
  bump(); saveState();

  for (i = 0; i < MARKET_GOODS.length; i++){ if (MARKET_GOODS[i].key === k) gd = MARKET_GOODS[i]; }
  if (!gd) return;
  if (state.coins < gd.price){
    Sound.click();
    toast('엽전이 ' + (gd.price - state.coins) + '냥 모자라요. 가져온 것을 팔아 볼까요?');
    return;

  state.coins -= gd.price;
  addItem(k, 1);
  state.stats.bought++; state.today.bought++; state.market.bought++;
  bump(); saveState();
  Sound.seed(); buzz();
  toast(gd.name + ' 하나 샀어요 (지갑 ' + state.coins + '냥)');

function seaScoop(){

  var kind = t.key;
  seaGame.target = null;
  seaGame.caught++;
  addItem(kind, 1);
  state.sea.caught++;
  state.stats.seaCaught++; state.today.sea++;
  bump(); saveState();
  Sound.catchIt(); Sound.plop(); buzz();
  toast(itemName(kind) + ' 하나 건졌어요!');

function openNeighbor(key){
  if (!NEIGHBORS[key]) key = 'neighborA';
  nbStop();
  nbGame = { key:key, phase:'yard', watching:true, crop:null, got:null, pen:'',
             progress:0, timer:null, penTimer:null, left:0 };

function nbSteal(cropKey){
  if (nbGame.phase !== 'yard') return;
  var nb = NEIGHBORS[nbGame.key] || NEIGHBORS.neighborA;
  var crop = null, i;
  for (i = 0; i < nb.crops.length; i++){ if (nb.crops[i].key === cropKey) crop = nb.crops[i]; }
  if (!crop) crop = nb.crops[Math.floor(Math.random() * nb.crops.length)];
  state.steal.tries++; state.stats.stealTry++; state.steal.last = crop.key;
  bump();
  if (nbGame.watching){
    state.steal.caught++; state.stats.stealCaught++;
    nbGame.phase = 'caught';
    nbGame.crop = crop.key;
    nbGame.got = null;
    nbStop();
    saveState(); Sound.soft(); buzz();
    toast('아이고, 들켰어라!');
    paint();
    return;
  }
  addItem(crop.key, 1);
  state.steal.got++; state.stats.stealGot++; state.today.steal++;
  saveState(); Sound.harvest(); buzz();
  toast(itemName(crop.key) + ' 하나 살짝 땄어요!');
  paint();
  nbWatchLoop();
}
function nbAsk(){
  if (nbGame.phase !== 'yard') return;
  var nb = NEIGHBORS[nbGame.key] || NEIGHBORS.neighborA;
  var crop = nb.crops[0];
  addItem(crop.key, 1);
  state.steal.asked++; state.stats.asked++; state.today.steal++;
  bump(); saveState();
  Sound.name(); buzz();
  toast(nb.who + sI(nb.who) + ' 웃으며 ' + itemName(crop.key) + sEul(itemName(crop.key)) + ' 하나 담아 주셨어요');
  paint();
  nbWatchLoop();
}
function nbPickPenalty(id){
  var p = PENALTIES[id];
  if (!p) return;
  nbGame.phase = 'penalty';
  nbGame.pen = id;
  nbGame.progress = 0;
  nbGame.left = p.need ? 0 : 6;
  Sound.click(); buzz();
  saveState(); paint();
  if (!p.need) nbHandsStart();
}
function nbPenTap(){
  var p = PENALTIES[nbGame.pen];
  if (!p || !p.need || nbGame.phase !== 'penalty') return;
  nbGame.progress++;
  Sound.click(); buzz();
  if (nbGame.progress >= p.need){ nbPenaltyDone(); return; }
  paint();
}
function nbHandsStart(){
  nbStopPen();
  nbGame.penTimer = setInterval(function(){
    nbGame.left--;
    if (nbGame.left <= 0){ nbStopPen(); nbPenaltyDone(); return; }
    paint();
  }, 1000);
}
function nbPenaltyDone(){
  nbStopPen();
  var nb = NEIGHBORS[nbGame.key] || NEIGHBORS.neighborA;
  var got = nbGame.crop || nb.crops[0].key;
  addItem(got, 1);
  nbGame.phase = 'sorry';
  nbGame.got = got;
  state.stats.penaltyDone++;
  state.steal.penalty++;
  state.steal.kind = PENALTIES[nbGame.pen] ? PENALTIES[nbGame.pen].name : '';
  state.today.steal++;
  bump(); saveState();
  Sound.done(); buzz();
  paint();
}
function nbBack(){
  if (nbGame.phase === 'sorry'){
    nbGame.phase = 'yard'; nbGame.crop = null; nbGame.got = null;
    nbGame.watching = true; nbGame.progress = 0; nbGame.pen = '';
  } else {
    nbGame.phase = 'yard'; nbGame.watching = true;
  }
  nbStop();
  Sound.click(); saveState(); paint();
  nbWatchLoop();
}
function nbSwitch(){
  var k = (nbGame.key === 'neighborB') ? 'neighborA' : 'neighborB';
  openNeighbor(k);
  toast((NEIGHBORS[k] ? NEIGHBORS[k].name : '') + sRo(NEIGHBORS[k] ? NEIGHBORS[k].name : '') + ' 건너갔어요');

function nbForceCaught(){

  nbGame.phase = 'caught';
  nbGame.crop = nb.crops[0].key;
  nbGame.watching = true;

  bump(); saveState(); paint();
}

function renderTown(){
  var cards = document.querySelectorAll('.town-card');
  for (var i = 0; i < cards.length; i++){
    var k = cards[i].getAttribute('data-town');
    cards[i].classList.toggle('is-selected', k === pickedPlace);
    cards[i].setAttribute('aria-pressed', k === pickedPlace ? 'true' : 'false');
  }
  var next = el('btnTownNext');
  if (next) next.disabled = !pickedPlace;
}

function go(id){
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++){
    screens[i].classList.toggle('is-active', screens[i].getAttribute('data-screen') === id);
  }
  if (id === 'hello') renderHello();
  if (id === 'town') renderTown();
  if (id === 'hub') mapSyncFromState();
  if (id !== 'rice') riceStop();
  if (id !== 'sea') seaStop();
  if (id !== 'neighbor') nbStop();
  paint();
  if (id === 'rice') riceResume();
  try{ if (window && window.scrollTo) window.scrollTo(0, 0); }catch(e){}
  saveState();
}

function toast(msg){
  var t = el('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('is-on');
  if (toastTimer){ try{ clearTimeout(toastTimer); }catch(e){} }
  toastTimer = null;
  if (typeof setTimeout === 'function'){
    toastTimer = setTimeout(function(){ t.classList.remove('is-on'); }, 2200);
  }
}
function openSheet(id){ var s = el(id); if (s) s.classList.add('is-open'); }
function closeSheet(id){ var s = el(id); if (s) s.classList.remove('is-open'); }
function bump(){
  state.stats.taps++;

function catchCritter(idx){
  if (!streamObjects) return;
  var o = null;
  for (var i = 0; i < streamObjects.length; i++){ if (streamObjects[i].id === idx) o = streamObjects[i]; }
  if (!o || o.caught) return;
  o.caught = true;
  addItem(o.key, 1);
  state.stats.caught++; state.today.caught++; state.today.stream++;
  bump(); saveState();
  Sound.catchIt(); buzz();

  var node = document.querySelector('[data-act="stream-catch"][data-idx="' + idx + '"]');
  if (node && node.classList) node.classList.add('is-caught');
  var countEl = document.querySelector('.stream-count');
  if (countEl) countEl.textContent = '오늘 잡은 것 ' + state.today.caught + '마리';

  if (state.today.caught % 3 === 0) toast('옛날엔 이걸 국으로 끓였지');
  else if (allCaught()) toast('오늘은 다 잡았어요');
  else toast(o.name + ' 한 마리 잡았어요!');

  defer(function(){ paint(); }, 360);
}
